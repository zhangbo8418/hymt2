# Universal Win64: CUDA + Vulkan + CPU. Runtime HYMT2_DEVICE=auto picks fastest.
# CUDA 10.2 artifact is Win7-compatible (subsystem 6.1). Vulkan via vulkan-1.dll at runtime.
name: windows-cuda

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tools/**'
      - 'include/**'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-cuda.yml'
      - 'scripts/ci_build_win_cuda.bat'
      - 'scripts/build_win_cuda_msvc.bat'

permissions:
  contents: read

jobs:
  universal-win7:
    name: Win7 universal (CUDA 10.2 + Vulkan + CPU)
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (VS2019 on windows-2019)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 10.2
        uses: Jimver/cuda-toolkit@v0.2.23
        id: cuda
        with:
          cuda: '10.2.89'
          method: network
          sub-packages: '["nvcc","cudart","visual_studio_integration"]'
          use-github-cache: true

      - name: Build
        shell: cmd
        run: scripts\ci_build_win_cuda.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hymt2-win7-universal
          path: |
            hymt2_cli.exe
            cudart64_*.dll
          if-no-files-found: error

  universal-win10:
    name: Win10+ universal (CUDA 12 + Vulkan + CPU)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CUDA 12.4
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: '12.4.0'
          method: network
          use-github-cache: true

      - name: Build
        shell: cmd
        run: scripts\ci_build_win_cuda.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hymt2-win10-universal
          path: |
            hymt2_cli.exe
            cudart64_*.dll
          if-no-files-found: error
